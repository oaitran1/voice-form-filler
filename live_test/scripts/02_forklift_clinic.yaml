title: Forklift — clinic visit, afternoon
hints: Ana R. Lopez, Sioux Falls, Tom Becker, Jane Ortiz, Sanford Clinic, Ken Moore, Industrial Way
script: >
  This report is by Jane Ortiz, Warehouse Supervisor, phone 605-555-0100.
  This is an injury report. The injured worker is Ana R. Lopez, female, a warehouse associate.
  She works full time, 40 hours a week. Her phone number is 605-555-0142.
  She lives at 18 Pine Avenue, Sioux Falls, South Dakota, 57104.
  Her date of birth is July 22nd, 1985, and she was hired on February 14th, 2019.
  On September 15th, 2026, she started work at 1 p.m.
  At about 4:40 in the afternoon she was stacking boxes in the warehouse at 200 Industrial Way, Sioux Falls,
  when a forklift backed into a pallet and a box fell on her left foot. It happened on the employer's premises.
  Safety equipment was provided, and she was wearing it.
  The witness was Tom Becker. She reported it to her supervisor, Jane Ortiz, on September 15th, 2026.
  She went to Sanford Clinic, 1305 West 18th Street, Sioux Falls, South Dakota, 57105,
  where Doctor Ken Moore treated her. She did not go to the emergency room and was not kept overnight.
