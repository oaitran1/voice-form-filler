<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="1400" height="860" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b8984"/></marker></defs>
<text x="700.0" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#16161a">Voice Form Filler — architecture</text>
<text x="700.0" y="60" text-anchor="middle" font-size="14" fill="#55544f">One recording → every safety form that applies, filled, saved and tracked. Everything runs on this Mac; nothing leaves it.</text>
<rect x="20" y="80" width="1360" height="150" rx="16" fill="none" stroke="#2a78d6" stroke-dasharray="6 6" stroke-width="1.5"/>
<text x="36" y="102" font-size="13" font-weight="700" fill="#2a78d6" letter-spacing="1">1 · HEAR</text>
<rect x="50" y="110" width="200" height="90" rx="12" fill="#f6f9fe" stroke="#2a78d6" stroke-width="2"/>
<text x="150.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Microphone</text>
<text x="150.0" y="158" text-anchor="middle" font-size="13" fill="#55544f">uv run record</text>
<text x="150.0" y="176" text-anchor="middle" font-size="13" fill="#55544f">or a voice memo / video / notes</text>
<text x="150.0" y="194" text-anchor="middle" font-size="13" fill="#55544f">(uv run make-report --input)</text>
<rect x="320" y="110" width="230" height="90" rx="12" fill="#f6f9fe" stroke="#2a78d6" stroke-width="2"/>
<text x="435.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Whisper large-v3-turbo</text>
<text x="435.0" y="158" text-anchor="middle" font-size="13" fill="#55544f">speech → text, offline</text>
<text x="435.0" y="176" text-anchor="middle" font-size="13" fill="#55544f">MLX on Apple Silicon</text>
<text x="435.0" y="194" text-anchor="middle" font-size="13" fill="#55544f">hints = names to spell right</text>
<rect x="620" y="110" width="200" height="90" rx="12" fill="#f6f9fe" stroke="#2a78d6" stroke-width="2"/>
<text x="720.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Transcript</text>
<text x="720.0" y="158" text-anchor="middle" font-size="13" fill="#55544f">what was said</text>
<text x="720.0" y="176" text-anchor="middle" font-size="13" fill="#55544f">say-words picked out:</text>
<text x="720.0" y="194" text-anchor="middle" font-size="13" fill="#55544f">"OSHA form" · "South Dakota form" · "Mishap"</text>
<path d="M250,155 L320,155" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M550,155 L620,155" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="900" y="110" width="450" height="90" rx="12" fill="#f6f9fe" stroke="#2a78d6" stroke-width="2"/>
<text x="1125.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Form picker</text>
<text x="1125.0" y="158" text-anchor="middle" font-size="13" fill="#55544f">a form named out loud → only that form, only its questions</text>
<text x="1125.0" y="176" text-anchor="middle" font-size="13" fill="#55544f">nothing named → every form the facts fit (injury, ship, base …)</text>
<text x="1125.0" y="194" text-anchor="middle" font-size="13" fill="#55544f">src/vff/forms.py: say / needs_any / applies_when</text>
<path d="M820,155 L900,155" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="20" y="250" width="1360" height="170" rx="16" fill="none" stroke="#eb6834" stroke-dasharray="6 6" stroke-width="1.5"/>
<text x="36" y="272" font-size="13" font-weight="700" fill="#eb6834" letter-spacing="1">2 · UNDERSTAND</text>
<rect x="50" y="290" width="380" height="110" rx="12" fill="#fff7f3" stroke="#eb6834" stroke-width="2"/>
<text x="240.0" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">gemma3:12b via Ollama</text>
<text x="240.0" y="338" text-anchor="middle" font-size="13" fill="#55544f">asked up to 3 separate questions, temperature 0, JSON schema:</text>
<text x="240.0" y="356" text-anchor="middle" font-size="13" fill="#55544f">story facts (who, when, where, injury, treatment, witnesses …)</text>
<text x="240.0" y="374" text-anchor="middle" font-size="13" fill="#55544f">company facts (only if the company is named)</text>
<text x="240.0" y="392" text-anchor="middle" font-size="13" fill="#55544f">mishap facts (ship, base, sea state, investigators …)</text>
<rect x="500" y="290" width="300" height="110" rx="12" fill="#fff7f3" stroke="#eb6834" stroke-width="2"/>
<text x="650.0" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Proof check</text>
<text x="650.0" y="338" text-anchor="middle" font-size="13" fill="#55544f">every answer must quote the transcript</text>
<text x="650.0" y="356" text-anchor="middle" font-size="13" fill="#55544f">unsupported → blank, never guessed</text>
<text x="650.0" y="374" text-anchor="middle" font-size="13" fill="#55544f">dates / times / phones normalised</text>
<text x="650.0" y="392" text-anchor="middle" font-size="13" fill="#55544f">src/vff/grounding.py · formats.py</text>
<rect x="870" y="290" width="480" height="110" rx="12" fill="#fff7f3" stroke="#eb6834" stroke-width="2"/>
<text x="1110.0" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Shared incident record</text>
<text x="1110.0" y="338" text-anchor="middle" font-size="13" fill="#55544f">one set of facts, ~120 keys (templates/incident_facts.yaml)</text>
<text x="1110.0" y="356" text-anchor="middle" font-size="13" fill="#55544f">+ company profile from data/profile.yaml when not said</text>
<text x="1110.0" y="374" text-anchor="middle" font-size="13" fill="#55544f">groups: story · company · mishap</text>
<path d="M430,345 L500,345" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M800,345 L870,345" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M1125,200 L1125,290" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="1125.0" y="245.0" text-anchor="middle" font-size="12" fill="#55544f">which questions to ask</text>
<path d="M720,200 L240,290" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="480.0" y="245.0" text-anchor="middle" font-size="12" fill="#55544f">the transcript</text>
<rect x="20" y="430" width="1360" height="170" rx="16" fill="none" stroke="#1baf7a" stroke-dasharray="6 6" stroke-width="1.5"/>
<text x="36" y="452" font-size="13" font-weight="700" fill="#1baf7a" letter-spacing="1">3 · FILL</text>
<rect x="50" y="470" width="300" height="110" rx="12" fill="#f3fbf7" stroke="#1baf7a" stroke-width="2"/>
<text x="200.0" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Form maps (YAML)</text>
<text x="200.0" y="518" text-anchor="middle" font-size="13" fill="#55544f">box → fact, one file per form</text>
<text x="200.0" y="536" text-anchor="middle" font-size="13" fill="#55544f">radio states, dropdown picks, by-hand boxes</text>
<text x="200.0" y="554" text-anchor="middle" font-size="13" fill="#55544f">required: preliminary → flagged if blank</text>
<text x="200.0" y="572" text-anchor="middle" font-size="13" fill="#55544f">templates/forms/*.yaml</text>
<rect x="420" y="470" width="410" height="110" rx="12" fill="#f3fbf7" stroke="#1baf7a" stroke-width="2"/>
<text x="625.0" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Fillable PDFs</text>
<text x="625.0" y="518" text-anchor="middle" font-size="13" fill="#55544f">OSHA 301 · South Dakota First Report of Injury</text>
<text x="625.0" y="536" text-anchor="middle" font-size="13" fill="#55544f">Mishap Information Worksheet (Navy / DoD, 203 boxes, 40 filled)</text>
<text x="625.0" y="554" text-anchor="middle" font-size="13" fill="#55544f">editable copy + print copy per form</text>
<text x="625.0" y="572" text-anchor="middle" font-size="13" fill="#55544f">src/vff/pdf_fill.py · boxes.py</text>
<rect x="900" y="470" width="450" height="110" rx="12" fill="#f3fbf7" stroke="#1baf7a" stroke-width="2"/>
<text x="1125.0" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Saved report (records/)</text>
<text x="1125.0" y="518" text-anchor="middle" font-size="13" fill="#55544f">transcript.txt · record.json (value + quote + check)</text>
<text x="1125.0" y="536" text-anchor="middle" font-size="13" fill="#55544f">forms.json (filled, notes, by hand, preliminary missing)</text>
<text x="1125.0" y="554" text-anchor="middle" font-size="13" fill="#55544f"><form>_filled.pdf · <form>_print.pdf</text>
<text x="1125.0" y="572" text-anchor="middle" font-size="13" fill="#55544f">private, gitignored, owner-only files</text>
<path d="M350,525 L420,525" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M830,525 L900,525" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M1125,400 L1125,470" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="1125.0" y="435.0" text-anchor="middle" font-size="12" fill="#55544f">facts → boxes</text>
<rect x="20" y="610" width="1360" height="175" rx="16" fill="none" stroke="#6250d6" stroke-dasharray="6 6" stroke-width="1.5"/>
<text x="36" y="632" font-size="13" font-weight="700" fill="#6250d6" letter-spacing="1">4 · TRACK & CHECK</text>
<rect x="50" y="650" width="300" height="110" rx="12" fill="#f6f4fd" stroke="#6250d6" stroke-width="2"/>
<text x="200.0" y="676" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Excel tracker</text>
<text x="200.0" y="698" text-anchor="middle" font-size="13" fill="#55544f">data_tracker/reports.xlsx</text>
<text x="200.0" y="716" text-anchor="middle" font-size="13" fill="#55544f">one sheet per form, one row per report</text>
<text x="200.0" y="734" text-anchor="middle" font-size="13" fill="#55544f">old filled PDFs imported too (add-old-pdfs)</text>
<rect x="420" y="650" width="410" height="110" rx="12" fill="#f6f4fd" stroke="#6250d6" stroke-width="2"/>
<text x="625.0" y="676" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Dashboard (uv run dashboard)</text>
<text x="625.0" y="698" text-anchor="middle" font-size="13" fill="#55544f">local server 127.0.0.1 only · rebuilt on every load</text>
<text x="625.0" y="716" text-anchor="middle" font-size="13" fill="#55544f">reports · forms · accuracy · over time</text>
<text x="625.0" y="734" text-anchor="middle" font-size="13" fill="#55544f">buttons: Record · Spoken test · Typed test · Excel · records</text>
<text x="625.0" y="752" text-anchor="middle" font-size="13" fill="#55544f">src/vff/dashboard*.py</text>
<rect x="900" y="650" width="450" height="110" rx="12" fill="#f6f4fd" stroke="#6250d6" stroke-width="2"/>
<text x="1125.0" y="676" text-anchor="middle" font-size="16" font-weight="700" fill="#16161a">Live test (uv run live-test)</text>
<text x="1125.0" y="698" text-anchor="middle" font-size="13" fill="#55544f">5 scripts with answer keys (live_test/scripts/)</text>
<text x="1125.0" y="716" text-anchor="middle" font-size="13" fill="#55544f">spoken or --typed → every box ✓ / ✗ / 👁</text>
<text x="1125.0" y="734" text-anchor="middle" font-size="13" fill="#55544f">RESULTS.md + live_test.xlsx per run</text>
<text x="1125.0" y="752" text-anchor="middle" font-size="13" fill="#55544f">baselines: 154/155 injury · 13/15 · 29/32 mishap</text>
<path d="M1125,580 L1125,650" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="1125.0" y="615.0" text-anchor="middle" font-size="12" fill="#55544f">scores the saved PDFs</text>
<path d="M1000,580 L300,650" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="640" y="608" text-anchor="middle" font-size="12" fill="#55544f">rebuild the tracker</text>
<path d="M900,705 L830,705" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="865.0" y="693" text-anchor="middle" font-size="12" fill="#55544f">runs → page</text>
<path d="M350,705 L420,705" stroke="#8b8984" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="700.0" y="846" text-anchor="middle" font-size="12" fill="#55544f">Offline boundary: the only internet use is the one-time download of the two models. Code: src/vff/ · forms: templates/ · private data: data/, records/, data_tracker/, live_test/results/</text>
</svg>