# Mishap Information Worksheet (Navy / DoD, AFSAS-style) — rebuilt as a fillable PDF from screen photos 2026-11-04.
# Box → fact map written by hand. Left blank on purpose: investigator sections (Risk Management, Human Factors, Cost,
# Findings/Recs, OFS/ORS, Exhibits except the witness list), Persons rows a story never carries (DOD ID, grade, AFSC …).
# No event-date box was photographed (the worksheet's first page is missing) — incident_date has nowhere to go yet.
# Fills only for a military story: needs_any = a ship, a base, or a mishap event type was said.
id: mishap_worksheet
title: Mishap Information Worksheet
pdf: mishap_worksheet.pdf
status: draft
needs_any: [ship_name, nearest_base, mishap_event_type]
say: [Mishap, Mishap worksheet, Mishap form]
boxes:
  - {box: General_Information.Event_Type__Secondary_Tiers, fact: mishap_event_type}
  - {box: General_Information.Local_Time, fact: [incident_time, incident_ampm]}
  - {box: General_Information.Date_Report_To_Safety_Office__Local, fact: reported_date}
  - {box: General_Information.One_Liner, fact: mishap_one_liner}
  - {box: General_Information.Did_this_event_occur_in_a_combat_zone, fact: combat_zone}
  - {box: General_Information.Did_this_mishap_occur_during_training, fact: during_training}
  - {box: General_Information.Were_there_any_eyewitnesses_to_this_event, fact: eyewitnesses}
  - {box: General_Information.Was_the_environment_a_factor_to_this_event, fact: environment_factor}
  - {box: Location.Event_Port, fact: event_port}
  - {box: Location.Event_ship_name, fact: ship_name}
  - {box: Location.General_Location, fact: general_location}
  - {box: Location.Location_Description, fact: location_description}
  - {box: Location.Latitude___Longitude, fact: latitude_longitude}
  - {box: Location.Base_where_Event_Occurred_or_Nearest_Base, fact: nearest_base}
  - {box: Location.Country, fact: country}
  - {box: Environment.Lighting_Conditions, fact: lighting_conditions}
  - {box: Environment.Visibility_Conditions, fact: visibility_conditions}
  - {box: Environment.Sea_State, fact: sea_state}
  - {box: Environment.Wind_Direction, fact: wind_direction}
  - {box: Environment.Wind_Speed, fact: wind_speed}
  - {box: Environment.Weather_Conditions, fact: weather_conditions}
  - {box: Persons.Person_s_Name, fact: [person_first_name, person_middle_initial, person_last_name]}
  - {box: Persons.Date_Hired, fact: person_hire_date}
  - {box: Persons.Sex, fact: person_gender}
  - {box: Persons.Activity, fact: activity_before}
  - {box: Persons.Provider_Information, fact: [doctor_name, facility_name]}
  - {box: Persons.Was_injured_person_treated_in_an_emergency_room, fact: er_visit}
  - {box: Persons.Was_injured_person_hospitalized_overnight_as_an_in_patient__not_observation_diagnostic_care, fact: hospitalized}
  - {box: Persons.Role, fact: person_job_title}
  - {box: Persons.Time_person_began_work, fact: [work_start_time, work_start_ampm]}
  - {box: Persons.Injured_Body_Part, fact: body_parts}
  - {box: Persons.Injury_Type, fact: injury_nature}
  - {box: Persons.Injury_Mechanism, fact: injury_cause}
  - {box: Persons.Was_safety_equipment_available, fact: safety_equipment_provided}
  - {box: Persons.Was_safety_equipment_used, fact: safety_equipment_used}
  - {box: Narrative.Preliminary_and_Status_Message_Narrative, fact: what_happened}
  - {box: Narrative.Sequence_of_Event, fact: sequence_of_events}
  - {box: Exhibits.Exhibit__Witness_List, fact: witness_names}

